name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run static tests
        run: python -m unittest discover -s tests

      - name: Compile process_stress
        run: python -m py_compile src/process_stress.py
